name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you re-publish without a commit (e.g. after flipping Pages visibility
  # in repo settings), and picks up a new `axiomatic-octo` release, whose
  # `--help` output is what the CLI reference page is generated from.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the docs toolchain
        run: pip install -r requirements-docs.txt

      - name: Build the site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        # Only the main-branch run publishes; PR runs stop at the strict build,
        # which is what catches broken nav entries and dead internal links.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
